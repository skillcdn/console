packages:
  - "apps/*"
  - "packages/*"

# One version per shared tool. Workspace packages reference these as "catalog:".
catalog:
  "@types/node": ^24.19.1
  typescript: ^7.0.2
  vitest: ^5.0.3
  zod: ^4.6.5

# Supply-chain guard: never resolve a version published less than 3 days ago (minutes).
# For an urgent security fix, or a fresh @skillcdn/* release that is needed now, list the package
# under minimumReleaseAgeExclude in the same change and take it out again afterwards.
minimumReleaseAge: 4320

# Dependency install scripts run only for packages approved here (`pnpm approve-builds`).
allowBuilds:
  esbuild: true

# The packages this organization publishes itself are excluded as a pattern: a fresh
# @skillcdn/* release is adopted at once, and the risk the rule guards against is elsewhere.
# Everything else waits the three days.
minimumReleaseAgeExclude:
  - "@skillcdn/*"
