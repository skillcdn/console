packages:
  - "apps/*"
  - "packages/*"

# One version per shared tool. Workspace packages reference these as "catalog:".
catalog:
  "@types/node": ^24.19.1
  typescript: ^7.0.2
  vitest: ^5.0.3
  zod: ^4.6.5

# Supply-chain guard: never resolve a version published less than 3 days ago (minutes).
# For an urgent security fix, or a fresh @skillcdn/* release that is needed now, list the package
# under minimumReleaseAgeExclude in the same change and take it out again afterwards.
minimumReleaseAge: 4320

# Dependency install scripts run only for packages approved here (`pnpm approve-builds`).
allowBuilds:
  esbuild: true

# @skillcdn/core 0.1.1 was published on 2026-10-09 and is adopted at once (docs/roadmap.md,
# milestone 2). pnpm checks the lockfile against the policy on every install, frozen included,
# so the exclusion stays until the release is three days old: take it out on 2026-10-12.
minimumReleaseAgeExclude:
  - "@skillcdn/core"
