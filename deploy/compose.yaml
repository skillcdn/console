# The smallest install: the console image next to PostgreSQL on one machine, the worker inside
# the api, the files in the database, and the packs read from a directory on this machine, so
# that nothing of it needs the internet (README.md, "The smallest install, and a closed
# network"). Not the cloud shape, which is the skill deploying-a-console (ADR-0017).
#
#   ./install.sh                     # writes the settings beside this file and brings it up
#
# or by hand, on an image built from the repository:
#
#   docker build -f deploy/Dockerfile -t skillcdn-console .
#   POSTGRES_PASSWORD=... docker compose -f deploy/compose.yaml up -d
#
# What signing in needs (PUBLIC_URL, a provider, AUTH_SECRET, ADMINS) goes in the .env beside
# this file, which git ignores, from the variables .env.example lists. The packs: <name> under
# the directory PACKS_PATH names, ./packs unless said, each a directory in the SkillCDN Format,
# is served as /local/org/<name>; PACKS_OWNER names the organization in place of `org`. The
# console's own skills come with the image, at /local/skillcdn/console.
name: skillcdn-console

x-console: &console
  image: ${CONSOLE_IMAGE:-skillcdn-console}
  env_file:
    - path: .env
      required: false
  environment:
    DATABASE_URL: postgres://console:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/console
    WORKER_IN_PROCESS: "true"
    SKILLS_DIR: /app/packs

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_USER: console
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: console
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U console -d console"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  migrate:
    <<: *console
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *console
    command: ["api"]
    ports:
      # The loopback alone unless CONSOLE_BIND says otherwise; a proxy in front terminates TLS.
      - "${CONSOLE_BIND:-127.0.0.1}:${CONSOLE_PORT:-11199}:11199"
    volumes:
      # The organization's packs, beside the console's own: <name> under it is /local/org/<name>.
      - ${PACKS_PATH:-./packs}:/app/packs/${PACKS_OWNER:-org}:ro
    depends_on:
      migrate:
        condition: service_completed_successfully
    # Ready when the database is reached, the schema is this build's and the workspace is found.
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:11199/readyz').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres-data:
